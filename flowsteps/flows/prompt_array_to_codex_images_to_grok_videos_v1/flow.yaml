schema: flowstep_flow_v4
flow_id: prompt_array_to_codex_images_to_grok_videos_v1
version: 1
context_policy: isolated
max_run_seconds: 28800
artifact_root: artifacts
milestones:
  - id: prompt_batch_ready
    output_contract: visual_prompt_batch_v1
    output_schema: schemas/prompt_batch_ready_v1.json
    outputs:
      - id: batch
        name: "Frozen editorial visual prompt batch"
        kind: json
        cardinality: one
        required: true
    success: "The non-empty source prompt array is preserved verbatim in source order, assigned stable prompt-NNN IDs, and frozen with built-in Codex ImageGen plus fixed 6-second vertical 9:16 720p video settings."
    gem: references/prompt_batch_ready.md
    flowsteps:
      - id: prepare_visual_prompt_batch
        tool: prepare_visual_prompt_batch
    tools: [prepare_visual_prompt_batch]
    intelligence: none
    on_tool_fail: BLOCKED
    draft_schema: milestones/prompt_batch_ready/draft.schema.json
    handler: milestones/prompt_batch_ready/assemble.py
    inputs:
      request: user.request
  - id: codex_images_generated_frozen
    output_contract: codex_image_batch_v1
    output_schema: schemas/codex_images_generated_frozen_v1.json
    outputs:
      - id: images
        name: "Ordered Codex ImageGen stills"
        kind: image
        cardinality: many
        required: true
      - id: manifest
        name: "Codex ImageGen batch manifest"
        kind: json
        cardinality: one
        required: true
    success: "Exactly one readable 9:16 image generated by Codex built-in ImageGen is frozen for every source prompt, with stable order, original prompt mapping, dimensions, byte count, and checksum."
    gem: references/codex_images_generated_frozen.md
    flowsteps:
      - id: generate_with_codex_builtin_imagegen
      - id: freeze_codex_image_batch
        tool: freeze_codex_image_batch
      - id: judge_codex_image_batch
        tool: codex_images_generated_judge
    tools: [freeze_codex_image_batch, codex_images_generated_judge]
    intelligence: completion
    on_tool_fail: need_model
    model_justification: "The built-in Codex ImageGen tool must be called once per editorial prompt; this action cannot be performed by deterministic local Python."
    max_model_attempts: 4
    max_attempts: 4
    draft_schema: milestones/codex_images_generated_frozen/draft.schema.json
    handler: milestones/codex_images_generated_frozen/assemble.py
    inputs:
      prompt_batch:
        from: prompt_batch_ready.visual_prompt_batch_v1
        output: batch
    loop: judge
    worker: codex_images_generated_judge
    receipt_schema: schemas/codex_images_generated_frozen_receipt_v1.json
  - id: image_video_prompts_frozen
    output_contract: image_video_prompt_batch_v1
    output_schema: schemas/image_video_prompts_frozen_v1.json
    outputs:
      - id: video_prompts
        name: "Ordered image-to-video prompt array"
        kind: json
        cardinality: one
        required: true
      - id: manifest
        name: "Image-to-video prompt binding manifest"
        kind: json
        cardinality: one
        required: true
    success: "The chosen strict JSON array contains exactly one bold 3-second forward animation prompt per frozen infographic image in source order; every prompt uses its corresponding image as the exact final still, specifies a large object-specific transformation, and satisfies the supplied style, continuity, aspect-ratio, final-hold, and negative constraints."
    gem: references/image_video_prompts_frozen.md
    flowsteps:
      - id: inspect_frozen_images
      - id: construct_image_video_prompts
      - id: judge_image_video_prompts
        tool: image_video_prompts_judge
    tools: [image_video_prompts_judge]
    intelligence: completion
    on_tool_fail: need_model
    model_justification: "Object-specific animation must be derived from private visual inspection of each frozen image."
    max_model_attempts: 4
    max_attempts: 4
    draft_schema: milestones/image_video_prompts_frozen/draft.schema.json
    handler: milestones/image_video_prompts_frozen/assemble.py
    inputs:
      images:
        from: codex_images_generated_frozen.codex_image_batch_v1
        output: images
      image_manifest:
        from: codex_images_generated_frozen.codex_image_batch_v1
        output: manifest
    loop: judge
    worker: image_video_prompts_judge
    receipt_schema: schemas/image_video_prompts_frozen_receipt_v1.json
  - id: grok_videos_generated_frozen
    output_contract: grok_image_video_batch_v1
    output_schema: schemas/grok_videos_generated_frozen_v1.json
    outputs:
      - id: videos
        name: "Ordered Grok Build image-derived video clips"
        kind: video
        cardinality: many
        required: true
      - id: receipt
        name: "Grok Build ACP image-to-video receipt"
        kind: json
        cardinality: one
        required: true
    success: "Exactly one playable approximately 3-second vertical 9:16 720p forward MP4 exists for every frozen Codex image; every clip ends on its matching target still, derives from a fresh 6-second Grok reverse master in one authenticated ACP process and session, and the complete receipt proves the ordered mapping and reverse-and-2x transform."
    gem: references/grok_videos_generated_frozen.md
    flowsteps:
      - id: run_persistent_grok_image_video_batch
        tool: grok_build_acp_image_video_batch
      - id: validate_grok_image_video_batch
        tool: validate_grok_image_video_batch
      - id: judge_grok_image_video_batch
        tool: grok_image_videos_generated_judge
    tools: [grok_build_acp_image_video_batch, validate_grok_image_video_batch, grok_image_videos_generated_judge]
    intelligence: none
    on_tool_fail: BLOCKED
    max_attempts: 1
    draft_schema: milestones/grok_videos_generated_frozen/draft.schema.json
    handler: milestones/grok_videos_generated_frozen/assemble.py
    inputs:
      prompt_batch:
        from: prompt_batch_ready.visual_prompt_batch_v1
        output: batch
      images:
        from: codex_images_generated_frozen.codex_image_batch_v1
        output: images
      image_manifest:
        from: codex_images_generated_frozen.codex_image_batch_v1
        output: manifest
      video_prompts:
        from: image_video_prompts_frozen.image_video_prompt_batch_v1
        output: video_prompts
      video_prompt_manifest:
        from: image_video_prompts_frozen.image_video_prompt_batch_v1
        output: manifest
    loop: judge
    worker: grok_image_videos_generated_judge
    receipt_schema: schemas/grok_videos_generated_frozen_receipt_v1.json
